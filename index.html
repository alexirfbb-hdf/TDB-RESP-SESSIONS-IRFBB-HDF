<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace responsables de session — IRFBB HDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#7c9070; --sage-dark:#5f7355;
    --sand:#f4eee0; --sand-dark:#e6d9bc;
    --terra:#c17a54; --terra-dark:#a5623f;
    --ink:#33302a; --ink-light:#6b6558;
    --white:#fffdf9;
    --danger:#b0503f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Work Sans',sans-serif; color:var(--ink);
    background:var(--sand); min-height:100vh;
  }
  h1,h2,h3{font-family:'Playfair Display',serif; font-weight:700; margin:0;}
  header.top{
    background:var(--sage-dark); color:var(--white); padding:20px 24px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  header.top h1{font-size:1.3rem;}
  header.top .who{font-size:0.9rem; opacity:0.9;}
  main{margin:0 auto; padding:24px 32px 60px;}
  .hidden{display:none !important;}

  /* --- Liste des sessions --- */
  .sessions-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:16px;
  }
  .session-card{
    background:var(--white); border:1px solid var(--sand-dark); border-radius:12px;
    padding:18px; cursor:pointer; transition:box-shadow .15s, transform .15s;
  }
  .session-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px);}
  .session-card h3{font-size:1.1rem; color:var(--sage-dark); margin-bottom:6px;}
  .session-card .meta{font-size:0.88rem; color:var(--ink-light);}
  .badge{
    display:inline-block; background:var(--terra); color:var(--white); font-size:0.72rem;
    padding:2px 8px; border-radius:999px; margin-top:8px;
  }

  /* --- Détail session --- */
  .back-btn{
    background:none; border:none; color:var(--sage-dark); font-family:inherit; font-size:0.95rem;
    cursor:pointer; padding:0; margin-bottom:14px; text-decoration:underline;
  }
  .session-header{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;
    margin-bottom:20px;
  }
  .session-header .meta{color:var(--ink-light); font-size:0.92rem; margin-top:4px;}
  .header-links{display:flex; gap:8px; flex-wrap:wrap;}
  .devoirs-link{
    display:inline-block; background:var(--terra); color:var(--white); text-decoration:none;
    padding:9px 16px; border-radius:8px; font-size:0.9rem; font-weight:500; white-space:nowrap;
  }
  .devoirs-link:hover{background:var(--terra-dark);}

  .layout{display:grid; grid-template-columns:1fr 380px; gap:24px; align-items:start;}
  @media (max-width:960px){ .layout{grid-template-columns:1fr;} }

  .panel{background:var(--white); border:1px solid var(--sand-dark); border-radius:12px; padding:18px;}
  .panel h2{font-size:1.05rem; color:var(--sage-dark); margin-bottom:12px;}

  /* --- Liste stagiaires (toujours visible, deux colonnes) --- */
  .stagiaire-search{
    width:100%; border:1px solid var(--sand-dark); border-radius:8px; padding:8px 11px;
    font-family:inherit; font-size:0.9rem; margin-bottom:12px; background:var(--white);
  }
  .stagiaire-search:focus{outline:2px solid var(--sage);}
  .stagiaires-table-head{
    display:flex; gap:14px; padding:0 4px 6px;
    font-size:0.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-light);
    border-bottom:2px solid var(--sand-dark);
  }
  .stagiaires-table-head span:first-child{width:150px; flex-shrink:0;}
  .stagiaires-list{
    display:flex; flex-direction:column;
    max-height:600px; overflow-y:auto; padding-right:4px;
  }
  .stagiaire-row{
    display:flex; gap:14px; align-items:flex-start;
    padding:12px 4px; border-bottom:1px solid var(--sand-dark);
  }
  .stagiaire-row:last-child{border-bottom:none;}
  .stagiaire-row .nom-col{
    width:150px; flex-shrink:0; display:flex; align-items:flex-start; gap:7px; padding-top:9px;
  }
  .stagiaire-row .nom-col span.nom-text{
    font-weight:500; font-size:0.92rem; word-break:break-word;
  }
  .pastille{
    width:9px; height:9px; border-radius:50%; background:var(--terra);
    flex-shrink:0; margin-top:5px; visibility:hidden;
  }
  .stagiaire-row.a-une-note .pastille{visibility:visible;}
  .note-col{flex:1; min-width:0;}
  textarea.note-textarea{
    width:100%; border:1px solid var(--sand-dark); border-radius:8px;
    padding:8px 11px; font-family:inherit; font-size:0.92rem; line-height:1.4;
    resize:none; overflow:hidden; min-height:40px; background:var(--sand);
  }
  textarea.note-textarea:focus{outline:2px solid var(--sage); background:var(--white);}
  .note-status{font-size:0.72rem; color:var(--sage-dark); height:14px; margin-top:3px;}

  /* --- Messagerie --- */
  .messages-list{
    display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto;
    padding-right:4px; margin-bottom:14px;
  }
  .msg{max-width:85%; padding:9px 12px; border-radius:10px; font-size:0.9rem; line-height:1.4;}
  .msg .meta{font-size:0.72rem; opacity:0.7; margin-bottom:3px;}
  .msg.mine{align-self:flex-end; background:var(--sage); color:var(--white); border-bottom-right-radius:2px;}
  .msg.other{align-self:flex-start; background:var(--sand); border-bottom-left-radius:2px;}
  .msg.traite{opacity:0.5;}
  .msg-text{white-space:pre-wrap; word-break:break-word;}
  .msg-controls{
    display:flex; align-items:center; gap:10px; margin-top:5px; font-size:0.72rem; opacity:0.85;
  }
  .msg-controls label{display:flex; align-items:center; gap:4px; cursor:pointer;}
  .msg-controls input[type="checkbox"]{margin:0; cursor:pointer;}
  .msg-edit-btn{
    background:none; border:none; padding:0; font-family:inherit; font-size:0.72rem;
    text-decoration:underline; color:inherit; cursor:pointer;
  }
  textarea.msg-edit-textarea{
    width:100%; font-family:inherit; font-size:0.9rem; border-radius:6px; padding:6px;
    resize:vertical; margin:2px 0; border:1px solid var(--sand-dark); color:var(--ink);
  }
  .compose textarea{
    width:100%; min-height:64px; border:1px solid var(--sand-dark); border-radius:8px;
    padding:9px; font-family:inherit; font-size:0.9rem; resize:vertical;
  }
  .compose-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap;}
  .notify-check{display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--ink-light);}
  .send-btn{
    background:var(--sage-dark); color:var(--white); border:none; border-radius:8px;
    padding:9px 18px; font-family:inherit; font-size:0.9rem; cursor:pointer;
  }
  .send-btn:hover{background:var(--sage);}
  .send-btn:disabled{opacity:0.5; cursor:default;}

  .file-row{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .file-label{
    cursor:pointer; color:var(--sage-dark); font-size:0.83rem; text-decoration:underline;
  }
  input[type="file"]#fileInput{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .file-name-label{font-size:0.83rem; color:var(--ink-light); word-break:break-all;}
  .file-remove-btn{
    background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem; padding:0;
  }
  .msg-attachment{
    display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:0.83rem;
    text-decoration:none; color:inherit; border-bottom:1px dashed currentColor; padding-bottom:1px;
  }
  .msg-attachment:hover{opacity:0.8;}

  .state-msg{text-align:center; color:var(--ink-light); padding:40px 12px;}
  .state-msg.error{color:var(--danger);}
</style>
</head>
<body>

<header class="top">
  <h1>Espace responsables de session</h1>
  <div class="who" id="whoLabel"></div>
</header>

<main>
  <div id="loadingState" class="state-msg">Chargement…</div>
  <div id="errorState" class="state-msg error hidden"></div>

  <!-- Vue liste des sessions -->
  <section id="sessionsView" class="hidden">
    <h2 style="font-family:'Playfair Display',serif;">Vos sessions</h2>
    <div class="sessions-grid" id="sessionsGrid"></div>
  </section>

  <!-- Vue détail d'une session -->
  <section id="detailView" class="hidden">
    <button class="back-btn" id="backBtn">← Retour à mes sessions</button>
    <div class="session-header">
      <div>
        <h2 id="detailTitle"></h2>
        <div class="meta" id="detailMeta"></div>
      </div>
      <div class="header-links">
        <a href="#" id="devoirsLink" class="devoirs-link hidden" target="_blank" rel="noopener">📁 Devoirs rendus</a>
        <a href="#" id="trombiLink" class="devoirs-link hidden" target="_blank" rel="noopener">🖼️ Trombinoscope</a>
        <a href="#" id="planningLink" class="devoirs-link hidden" target="_blank" rel="noopener">🗓️ Planning</a>
        <a href="#" id="assiduiteLink" class="devoirs-link hidden" target="_blank" rel="noopener">✅ Assiduité</a>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>Stagiaires</h2>
        <input type="text" id="stagiaireSearch" class="stagiaire-search" placeholder="Rechercher un stagiaire…">
        <div class="stagiaires-table-head">
          <span>Stagiaire</span>
          <span>Note</span>
        </div>
        <div class="stagiaires-list" id="stagiairesList"></div>
      </div>

      <div class="panel">
        <h2>Messages de la session</h2>
        <div class="messages-list" id="messagesList"></div>
        <div class="compose">
          <textarea id="messageInput" placeholder="Écrire un message…"></textarea>
          <div class="file-row">
            <label class="file-label" for="fileInput">📎 Joindre un fichier</label>
            <input type="file" id="fileInput">
            <span class="file-name-label" id="fileNameLabel"></span>
            <button type="button" class="file-remove-btn hidden" id="fileRemoveBtn">✕ retirer</button>
          </div>
          <div class="compose-row">
            <label class="notify-check">
              <input type="checkbox" id="notifyCheck">
              Envoyer aussi une notification par email
            </label>
            <button class="send-btn" id="sendBtn">Envoyer</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
// ============================================================
// CONFIG — coller ici l'URL /exec obtenue lors du déploiement du Web App Apps Script
// ============================================================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwEDnON53P6Uz_A2DrMDGxGStGCpfJNbF-ZwyYYL_nKbacbCCispmFmZiQpm7QRnlKm/exec'
};

const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token');

let currentSessionId = null;
let viewerIsAdmin = false;
let viewerNom = '';
let selectedFile = null;
const TAILLE_FICHIER_MAX = 8 * 1024 * 1024; // 8 Mo

const el = (id) => document.getElementById(id);

function showState(view) {
  ['loadingState', 'errorState', 'sessionsView', 'detailView'].forEach((id) => {
    el(id).classList.toggle('hidden', id !== view);
  });
}

async function apiGet(action, extraParams = {}) {
  const url = new URL(CONFIG.API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('token', TOKEN);
  Object.entries(extraParams).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function apiPost(payload) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // évite le préflight CORS
    body: JSON.stringify({ ...payload, token: TOKEN })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ------------------------------------------------------------
// Init
// ------------------------------------------------------------
async function init() {
  if (!TOKEN) {
    showError("Lien incomplet : aucun token n'a été fourni.");
    return;
  }
  try {
    const data = await apiGet('getSessions');
    viewerIsAdmin = !!data.responsable.isAdmin;
    viewerNom = data.responsable.nom;
    el('whoLabel').textContent = data.responsable.nom;
    renderSessionsList(data.sessions);
    showState('sessionsView');
  } catch (err) {
    showError(err.message);
  }
}

function showError(message) {
  el('errorState').textContent = message;
  showState('errorState');
}

function renderSessionsList(sessions) {
  const grid = el('sessionsGrid');
  grid.innerHTML = '';
  if (sessions.length === 0) {
    grid.innerHTML = '<p style="color:var(--ink-light)">Aucune session pour le moment.</p>';
    return;
  }
  sessions.forEach((s) => {
    const card = document.createElement('div');
    card.className = 'session-card';
    card.innerHTML = `
      <h3>${escapeHtml(s.formation)}</h3>
      <div class="meta">${escapeHtml(s.site || '')}</div>
      <div class="meta">${formatDateRange(s.date_debut, s.date_fin)}</div>
      <span class="badge">Ouvrir</span>
    `;
    card.addEventListener('click', () => openSession(s.id));
    grid.appendChild(card);
  });
}

// ------------------------------------------------------------
// Détail session
// ------------------------------------------------------------
async function openSession(sessionId) {
  currentSessionId = sessionId;
  showState('loadingState');
  try {
    const data = await apiGet('getSessionDetail', { sessionId });
    renderSessionDetail(data);
    showState('detailView');
    apiPost({ action: 'markMessagesRead', sessionId }).catch(() => {});
  } catch (err) {
    showError(err.message);
  }
}

function renderSessionDetail(data) {
  const { session, stagiaires, messages } = data;
  el('detailTitle').textContent = session.formation;
  el('detailMeta').textContent = `${session.site || ''} · ${formatDateRange(session.date_debut, session.date_fin)}`;

  setHeaderLink('devoirsLink', session.lien_devoirs);
  setHeaderLink('trombiLink', session.lien_trombinoscope);
  setHeaderLink('planningLink', session.lien_planning);
  setHeaderLink('assiduiteLink', session.lien_assiduite);

  renderStagiaires(stagiaires);
  renderMessages(messages);
}

function setHeaderLink(elementId, url) {
  const link = el(elementId);
  if (url) {
    link.href = url;
    link.classList.remove('hidden');
  } else {
    link.classList.add('hidden');
  }
}

function renderStagiaires(stagiaires) {
  const list = el('stagiairesList');
  list.innerHTML = '';

  if (stagiaires.length === 0) {
    const p = document.createElement('p');
    p.style.color = 'var(--ink-light)';
    p.textContent = 'Aucun stagiaire pour cette session.';
    list.appendChild(p);
    el('stagiaireSearch').value = '';
    return;
  }

  stagiaires.forEach((st) => {
    const nomComplet = `${st.prenom || ''} ${st.nom || ''}`.trim();

    const row = document.createElement('div');
    row.className = 'stagiaire-row';
    row.dataset.nom = nomComplet.toLowerCase();
    if (st.note && st.note.trim()) row.classList.add('a-une-note');

    const nomCol = document.createElement('div');
    nomCol.className = 'nom-col';
    const pastille = document.createElement('span');
    pastille.className = 'pastille';
    const nomText = document.createElement('span');
    nomText.className = 'nom-text';
    nomText.appendChild(document.createTextNode(nomComplet || '(sans nom)'));
    nomCol.appendChild(pastille);
    nomCol.appendChild(nomText);

    const noteCol = document.createElement('div');
    noteCol.className = 'note-col';

    const textarea = document.createElement('textarea');
    textarea.className = 'note-textarea';
    textarea.placeholder = 'Rien à signaler';
    textarea.value = st.note || '';
    textarea.rows = 1;

    const status = document.createElement('div');
    status.className = 'note-status';

    noteCol.appendChild(textarea);
    noteCol.appendChild(status);
    row.appendChild(nomCol);
    row.appendChild(noteCol);
    list.appendChild(row);

    autoResize(textarea);

    let timer;
    textarea.addEventListener('input', () => {
      autoResize(textarea);
      row.classList.toggle('a-une-note', textarea.value.trim() !== '');
      clearTimeout(timer);
      status.textContent = '…';
      timer = setTimeout(() => saveNote(st.id, textarea.value, status), 700);
    });
  });

  el('stagiaireSearch').value = '';
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = (textarea.scrollHeight + 2) + 'px';
}

function filtrerStagiaires(terme) {
  const t = terme.trim().toLowerCase();
  document.querySelectorAll('.stagiaire-row').forEach((row) => {
    const visible = !t || row.dataset.nom.includes(t);
    row.classList.toggle('hidden', !visible);
  });
}

async function saveNote(stagiaireId, note, statusEl) {
  try {
    await apiPost({ action: 'updateNote', sessionId: currentSessionId, stagiaireId, note });
    statusEl.textContent = 'Enregistré ✓';
    setTimeout(() => { if (statusEl.textContent === 'Enregistré ✓') statusEl.textContent = ''; }, 2000);
  } catch (err) {
    statusEl.textContent = 'Erreur : ' + err.message;
  }
}

function renderMessages(messages) {
  const list = el('messagesList');
  list.innerHTML = '';
  messages.forEach((m) => {
    // Une session peut avoir plusieurs responsables : on compare aussi le nom
    // pour que chacun ne voie ses propres messages qu'à droite, pas ceux d'un collègue.
    const mine = viewerIsAdmin
      ? m.auteur_type === 'alex'
      : (m.auteur_type === 'responsable' && m.auteur_nom === viewerNom);

    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'mine' : 'other');
    if (m.traite) div.classList.add('traite');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${m.auteur_nom} · ${formatDateTime(m.date)}` + (m.modifie ? ' · modifié' : '');

    const texteEl = document.createElement('div');
    texteEl.className = 'msg-text';
    texteEl.textContent = m.texte || '';
    if (!m.texte) texteEl.classList.add('hidden');

    const controls = document.createElement('div');
    controls.className = 'msg-controls';

    const traiteLabel = document.createElement('label');
    const traiteCheckbox = document.createElement('input');
    traiteCheckbox.type = 'checkbox';
    traiteCheckbox.checked = !!m.traite;
    traiteCheckbox.addEventListener('change', async () => {
      const val = traiteCheckbox.checked;
      try {
        await apiPost({ action: 'toggleMessageTraite', sessionId: currentSessionId, messageId: m.id, traite: val });
        m.traite = val;
        div.classList.toggle('traite', val);
      } catch (err) {
        traiteCheckbox.checked = !val;
        alert('Erreur : ' + err.message);
      }
    });
    traiteLabel.appendChild(traiteCheckbox);
    traiteLabel.appendChild(document.createTextNode('Traité'));
    controls.appendChild(traiteLabel);

    if (mine) {
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'msg-edit-btn';
      editBtn.textContent = 'Modifier';
      editBtn.addEventListener('click', () => startEditMessage(div, texteEl, meta, m));
      controls.appendChild(editBtn);
    }

    div.appendChild(meta);
    div.appendChild(texteEl);

    if (m.fichier_url) {
      const attach = document.createElement('a');
      attach.className = 'msg-attachment';
      attach.href = m.fichier_url;
      attach.target = '_blank';
      attach.rel = 'noopener';
      attach.textContent = '📎 ' + (m.fichier_nom || 'Fichier joint');
      div.appendChild(attach);
    }

    div.appendChild(controls);
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}

function startEditMessage(div, texteEl, meta, m) {
  const textarea = document.createElement('textarea');
  textarea.className = 'msg-edit-textarea';
  textarea.value = m.texte;
  div.replaceChild(textarea, texteEl);
  textarea.focus();

  const terminerEdition = async () => {
    const nouveauTexte = textarea.value.trim();
    if (nouveauTexte && nouveauTexte !== m.texte) {
      try {
        await apiPost({ action: 'updateMessage', sessionId: currentSessionId, messageId: m.id, texte: nouveauTexte });
        m.texte = nouveauTexte;
        m.modifie = true;
        meta.textContent = `${m.auteur_nom} · ${formatDateTime(m.date)} · modifié`;
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    }
    const nouveauTexteEl = document.createElement('div');
    nouveauTexteEl.className = 'msg-text';
    nouveauTexteEl.textContent = m.texte;
    div.replaceChild(nouveauTexteEl, textarea);
  };

  textarea.addEventListener('blur', terminerEdition);
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      textarea.blur();
    }
  });
}

async function sendMessage() {
  const input = el('messageInput');
  const notify = el('notifyCheck');
  const btn = el('sendBtn');
  const texte = input.value.trim();
  if (!texte && !selectedFile) return;

  btn.disabled = true;
  try {
    const payload = {
      action: 'postMessage',
      sessionId: currentSessionId,
      texte,
      notifier: notify.checked
    };
    if (selectedFile) {
      payload.fichierBase64 = selectedFile.base64;
      payload.fichierNom = selectedFile.nom;
      payload.fichierType = selectedFile.type;
    }
    await apiPost(payload);
    input.value = '';
    notify.checked = false;
    el('fileInput').value = '';
    clearSelectedFile();
    const data = await apiGet('getSessionDetail', { sessionId: currentSessionId });
    renderMessages(data.messages);
  } catch (err) {
    alert('Erreur : ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = () => reject(new Error('Lecture du fichier impossible.'));
    reader.readAsDataURL(file);
  });
}

function clearSelectedFile() {
  selectedFile = null;
  el('fileNameLabel').textContent = '';
  el('fileRemoveBtn').classList.add('hidden');
}

async function handleFileChange(e) {
  const file = e.target.files[0];
  if (!file) { clearSelectedFile(); return; }
  if (file.size > TAILLE_FICHIER_MAX) {
    alert('Fichier trop volumineux (8 Mo maximum). Choisis un fichier plus léger.');
    e.target.value = '';
    clearSelectedFile();
    return;
  }
  try {
    const base64 = await fileToBase64(file);
    selectedFile = { base64, nom: file.name, type: file.type || 'application/octet-stream' };
    el('fileNameLabel').textContent = file.name;
    el('fileRemoveBtn').classList.remove('hidden');
  } catch (err) {
    alert(err.message);
    e.target.value = '';
    clearSelectedFile();
  }
}

// ------------------------------------------------------------
// Helpers
// ------------------------------------------------------------
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatDateRange(start, end) {
  const f = (d) => d ? new Date(d).toLocaleDateString('fr-FR') : '';
  const s = f(start), e = f(end);
  if (s && e) return `${s} → ${e}`;
  return s || e || '';
}

function formatDateTime(d) {
  if (!d) return '';
  return new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

el('backBtn').addEventListener('click', () => {
  currentSessionId = null;
  showState('sessionsView');
});
el('sendBtn').addEventListener('click', sendMessage);
el('messageInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendMessage();
});
el('stagiaireSearch').addEventListener('input', (e) => filtrerStagiaires(e.target.value));
el('fileInput').addEventListener('change', handleFileChange);
el('fileRemoveBtn').addEventListener('click', () => {
  el('fileInput').value = '';
  clearSelectedFile();
});

init();
</script>
</body>
